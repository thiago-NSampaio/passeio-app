<div class="p-6 max-w-lg mx-auto bg-white shadow-lg mt-6">
  <h2 class="text-2xl font-semibold text-gray-700 mb-4">Nova categoria</h2>

  <form id="categoryForm" [formGroup]="categoryForm" (ngSubmit)="save()">
    <div class="mb-4">
      <label class="block text-gray-600 font-medium mb-2">Nome</label>
      <input
        type="text"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
        id="name"
        formControlName="name"
        name="name"
        placeholder="Ex: Restaurantes, Praias, Shopping"
      />
      <span
        class="text-red-500 text-sm"
        *ngIf="isFieldCategoryFormValided('name')"
      >
        Campo Obrigatório
      </span>
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 font-medium mb-2">Descrição</label>
      <textarea
        rows="4"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
        id="description"
        formControlName="description"
        name="description"
      ></textarea>
      <span
        class="text-red-500 text-sm"
        *ngIf="isFieldCategoryFormValided('description')"
      >
        Campo Obrigatório
      </span>
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white font-semibold p-3 rounded shadow hover:bg-blue-700"
    >
      Cadastrar
    </button>
  </form>
</div>
