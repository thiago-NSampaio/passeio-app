<div class="p-6 max-w-lg mx-auto bg-white shadow-lg mt-6">
  <h2 class="text-2xl font-semibold text-gray-700 mb-4">Novo lugar</h2>
  <hr />

  <form id="placeForm" [formGroup]="form" (ngSubmit)="save()">
    <div class="mb-4">
      <label for="name" class="block text-gray-600 font-medium mb-2"
        >Nome</label
      >
      <input
        type="text"
        id="name"
        name="name"
        formControlName="name"
        placeholder="Ex: Praia do Sol, Restaurante"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
      />
      <span class="text-red-500 text-sm" *ngIf="isFormValided('name')">
        Campo Obrigatório
      </span>
    </div>

    <div class="mb-4">
      <label for="category" class="block text-gray-600 font-medium mb-2"
        >Categoria</label
      >
      <select
        name="category"
        id="category"
        formControlName="category"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
      >
        <option selected [value]="">Selecione uma categoria</option>

        <option [value]="category.id" *ngFor="let category of categories">
          {{ category.name }}
        </option>
      </select>

      <span class="text-red-500 text-sm" *ngIf="isFormValided('category')">
        Campo Obrigatório
      </span>
    </div>

    <div class="mb-4">
      <label for="localization" class="block text-gray-600 font-medium mb-2"
        >Localização</label
      >
      <input
        type="text"
        id="localization"
        name="localization"
        formControlName="localization"
        placeholder="Ex: São Paulo"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
      />
      <span class="text-red-500 text-sm" *ngIf="isFormValided('localization')">
        Campo Obrigatório
      </span>
    </div>

    <div class="mb-4">
      <label for="urlPhoto" class="block text-gray-600 font-medium mb-2"
        >Foto</label
      >
      <input
        type="text"
        id="urlPhoto"
        name="urlPhoto"
        formControlName="urlPhoto"
        placeholder="Ex: http://exemplo.com/foto.jpg"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
      />
      <span class="text-red-500 text-sm" *ngIf="isFormValided('urlPhoto')">
        Campo Obrigatório
      </span>
    </div>

    <div class="mb-4">
      <label for="avaliation" class="block text-gray-600 font-medium mb-2"
        >Avaliação</label
      >
      <select
        name="avaliation"
        id="avaliation"
        formControlName="avaliation"
        class="w-full p-3 border border-gray-300 outline-none rounded shadow-sm focus:ring focus:ring-blue-300"
      >
        <option selected [value]="">Selecione uma avaliação</option>
        <option [value]="1">1 - Ruim</option>
        <option [value]="2">2 - Regular</option>
        <option [value]="3">3 - Bom</option>
        <option [value]="4">4 - Muito Bom</option>
        <option [value]="5">5 - Excelente</option>
      </select>
      <span class="text-red-500 text-sm" *ngIf="isFormValided('avaliation')">
        Campo Obrigatório
      </span>
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white font-semibold p-3 rounded shadow hover:bg-blue-700"
    >
      Cadastrar Lugar
    </button>
  </form>
</div>
